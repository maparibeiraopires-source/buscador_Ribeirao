<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Análise de Ruas</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{font-family:'Montserrat',sans-serif;background:#f4f6f8;padding:20px}
h1{margin-bottom:20px}

.toolbar{display:flex;gap:10px;margin-bottom:20px}
input{padding:10px;border-radius:8px;border:1px solid #ccc;width:300px}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:16px
}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.08)
}

.card h3{margin:0 0 8px;font-size:18px}

.meta{font-size:13px;color:#555}

.calc{margin-top:8px;font-weight:600}

.tag{
  display:inline-block;
  padding:4px 8px;
  border-radius:12px;
  font-size:11px;
  font-weight:700;
  margin-right:6px;
}

.sem-saida{background:#ffe5e5;color:#a30000}
.fechada{background:#e5e9ff;color:#1f2ea3}
.parcial{background:#fff3cd;color:#856404}
.projeto{background:#e0f7fa;color:#006064}

.btn{
  display:inline-block;
  margin-top:10px;
  padding:8px 12px;
  border-radius:8px;
  background:#1f2937;
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:600
}

.totais{
  margin-top:30px;
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 6px 18px rgba(0,0,0,.08)
}
</style>
</head>

<body>

<h1>Sistema de Análise de Ruas</h1>

<div class="toolbar">
  <input type="search" id="search" placeholder="Buscar rua, bairro, CEP...">
</div>

<div class="cards" id="cards"></div>
<div class="totais" id="totais"></div>

<script>

// 🔢 número seguro
function toNumber(v){
  if(!v) return 0;
  return Number(String(v).replace(',', '.')) || 0;
}

// 🔍 normalizar texto
function normalizar(txt){
  return String(txt || '')
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

// 📍 link mapa
function coordsParaLink(c){
  if(!c) return null;
  return `https://www.google.com/maps?q=${encodeURIComponent(c)}`;
}

// 🔥 trata escadaria (objeto ou número)
function getEscadaria(valor){
  if(!valor) return 0;

  if(typeof valor === "object"){
    let total = 0;
    for(let k in valor){
      total += toNumber(valor[k]);
    }
    return total;
  }

  return toNumber(valor);
}

let dados = [];

function getCampo(d, ...aliases){
  if(!d) return '';

  for(const alias of aliases){
    const value = d[alias];
    if(value !== undefined && value !== null && value !== '') return value;
  }

  const aliasesNorm = aliases.map(a => String(a).toLowerCase().replace(/[^a-z0-9]+/g,''));

  for(const [key, value] of Object.entries(d)){
    const keyNorm = String(key).toLowerCase().replace(/[^a-z0-9]+/g,'');
    if(aliasesNorm.includes(keyNorm)) return value;
  }

  return '';
}

function normalizarRua(d){
  return {
    TIPO: getCampo(d, 'TIPO', 'tipo'),
    'COMPLEMENTO DO NOME': getCampo(d, 'COMPLEMENTO DO NOME', 'complementoDoNome'),
    NOME: getCampo(d, 'NOME', 'nome'),
    'NOME ANTERIOR DA RUA': getCampo(d, 'NOME ANTERIOR DA RUA', 'nomeAnteriorDaRua'),
    'LOCALIZAÇÃO NO MAPA OFICIAL': getCampo(d, 'LOCALIZAÇÃO NO MAPA OFICIAL', 'localizacaoNoMapaOficial'),
    TERRA: getCampo(d, 'TERRA', 'terra'),
    BLOQUETE: getCampo(d, 'BLOQUETE', 'bloquete'),
    'PARALELEPÍPEDO': getCampo(d, 'PARALELEPÍPEDO', 'paralelepipedo'),
    ASFALTO: getCampo(d, 'ASFALTO', 'asfalto'),
    'NOME COMPLETO': getCampo(d, 'NOME COMPLETO', 'nomeCompleto'),
    CEP: getCampo(d, 'CEP', 'cep'),
    'METRAGEM ESCADARIA': getCampo(d, 'METRAGEM ESCADARIA', 'metragemEscadaria'),
    VILA: getCampo(d, 'VILA', 'vila'),
    BAIRRO: getCampo(d, 'BAIRRO', 'bairro'),
    'DECRETO OU LEI': getCampo(d, 'DECRETO OU LEI', 'decretoOuLei'),
    REVISADO: getCampo(d, 'REVISADO', 'revisado'),
    COORDENADAS: getCampo(d, 'COORDENADAS', 'coordenadas'),
    'SEM SAÍDA': getCampo(d, 'SEM SAÍDA', 'semSaida'),
    FECHADA: getCampo(d, 'FECHADA', 'fechada'),
    'FECHADA PARCIALMENTE': getCampo(d, 'FECHADA PARCIALMENTE', 'fechadaParcialmente'),
    'EM PROJETO': getCampo(d, 'EM PROJETO', 'emProjeto')
  };
}

function carregarDados(){
  fetch('./vias.json')
    .then(res => {
      if(!res.ok) throw new Error('Não foi possível carregar o arquivo externo');
      return res.json();
    })
    .then(data => {
      dados = Array.isArray(data) ? data : (data.vias || []);
      render();
    })
    .catch(err => {
      console.error(err);
      document.getElementById('cards').innerHTML = '<div class="card">Não foi possível carregar os dados do arquivo externo.</div>';
      document.getElementById('totais').innerHTML = '';
    });
}

const search = document.getElementById('search');

search.addEventListener('input', render);

function render(){

  const termo = normalizar(search.value);
  const cards = document.getElementById('cards');
  cards.innerHTML='';

  let totalCidade={terra:0,bloq:0,para:0,asf:0,esc:0};

  let contSemSaida=0;

  dados
  .filter(d=>{
    const rua = normalizarRua(d);
    return Object.values(rua).some(v =>
      normalizar(v).includes(termo)
    );
  })
  .forEach(d=>{

    const rua = normalizarRua(d);

    const nomeCompleto=[
      rua['TIPO'],
      rua['COMPLEMENTO DO NOME'],
      rua['NOME']
    ].filter(Boolean).join(' ');

    const terra = toNumber(rua['TERRA']);
    const bloq = toNumber(rua['BLOQUETE']);
    const para = toNumber(rua['PARALELEPÍPEDO']);
    const asf  = toNumber(rua['ASFALTO']);
    const esc  = getEscadaria(rua['METRAGEM ESCADARIA']);

    const totalRua = terra + bloq + para + asf + esc;

    totalCidade.terra+=terra;
    totalCidade.bloq+=bloq;
    totalCidade.para+=para;
    totalCidade.asf+=asf;
    totalCidade.esc+=esc;

    const semSaida = normalizar(rua['SEM SAÍDA'])==='sem saida';
    if(semSaida) contSemSaida++;

    const linkMapa=coordsParaLink(rua['COORDENADAS']);

    const card=document.createElement('div');
    card.className='card';

    card.innerHTML=`
      <h3>${nomeCompleto}</h3>

      ${semSaida?'<span class="tag sem-saida">SEM SAÍDA</span>':''}

      <div class="meta">Vila: ${rua['VILA']||'-'} | Bairro: ${rua['BAIRRO']||'-'}</div>
      <div class="meta">CEP: ${rua['CEP']||'-'}</div>

      <div class="calc">
        Terra: ${terra} m<br>
        Bloquete: ${bloq} m<br>
        Paralelepípedo: ${para} m<br>
        Asfalto: ${asf} m<br>
        Escadaria: ${esc} m<br><br>

        <strong>Total:</strong> ${totalRua} m
      </div>

      ${linkMapa?`<a class="btn" href="${linkMapa}" target="_blank">Ver no mapa</a>`:''}
    `;

    cards.appendChild(card);
  });

  document.getElementById('totais').innerHTML=`
    <h2>Totais Gerais</h2>

    Terra: ${totalCidade.terra} m<br>
    Bloquete: ${totalCidade.bloq} m<br>
    Paralelepípedo: ${totalCidade.para} m<br>
    Asfalto: ${totalCidade.asf} m<br>
    Escadarias: ${totalCidade.esc} m<br><br>

    Sem saída: ${contSemSaida}
  `;
}

// primeira renderização
carregarDados();

</script>

</body>
</html>
